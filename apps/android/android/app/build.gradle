apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def releaseKeystore = System.getenv('GLANCE_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('GLANCE_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('GLANCE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('GLANCE_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace = "io.gjessing.glance"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.gjessing.glance"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 51
        versionName "0.5.43"
    }
    buildFeatures { buildConfig = true }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

repositories {
    flatDir { dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.work:work-runtime-ktx:2.10.5"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20250517"
}

apply from: 'capacitor.build.gradle'
